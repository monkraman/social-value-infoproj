services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: social_value_pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_value_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_value_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:

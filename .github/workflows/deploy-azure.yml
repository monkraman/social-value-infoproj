name: Deploy backend to Azure (UK South)

# Runs only when started by hand (Actions > this workflow > Run workflow). Render keeps deploying
# from main on its own; Azure takes a release only through this workflow, after the tests pass and
# a reviewer of the "azure" environment approves it.
#
# Needs, in Settings > Environments > azure (variables, not secrets: none of these is a password):
#   AZURE_CLIENT_ID        client ID of the user-assigned managed identity used for deployment
#   AZURE_TENANT_ID        Azure tenant ID
#   AZURE_SUBSCRIPTION_ID  Azure subscription ID
#   AZURE_WEBAPP_NAME      App Service name, e.g. app-socialvalue-uks
#   AZURE_API_URL          App Service URL, e.g. https://app-socialvalue-uks.azurewebsites.net
# The managed identity needs a federated credential for this repository and the "azure"
# environment, and the Website Contributor role on the App Service.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_value_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway values for the test database inside this job only.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/social_value_test
      JWT_SECRET_KEY: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-not-a-real-key
      LLM_PROVIDER: offline
      EMBEDDING_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write   # password-less sign-in to Azure through the managed identity
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # App Service installs requirements.txt itself (app setting SCM_DO_BUILD_DURING_DEPLOYMENT=true)
      # and starts the app with startup.sh.
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.AZURE_API_URL }}/health"; then echo; echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "The application did not report healthy within 5 minutes." >&2
          exit 1
